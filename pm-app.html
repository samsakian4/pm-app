<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نگهداری و تعمیرات دستگاه‌ها</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f172a; --panel:#1a2436; --panel2:#212d42; --border:#2c3a54;
    --text:#e8edf7; --muted:#93a2bd;
    --accent:#4f8cff; --accent2:#2ecfa5;
    --red:#ff5b6e; --orange:#ffab40; --yellow:#f4d35e; --green:#2ecfa5;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Vazirmatn',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh;
  }
  header{
    padding:18px 24px; background:linear-gradient(135deg,#16213a,#101a2e);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  header h1{margin:0; font-size:20px; font-weight:700;}
  header p{margin:4px 0 0; color:var(--muted); font-size:13px;}
  nav{
    display:flex; gap:8px; padding:10px 24px; background:#111c30; border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  nav button{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:9px 16px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:14px;
    white-space:nowrap; transition:.15s;
  }
  nav button.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  main{padding:20px 24px 60px; max-width:1100px; margin:0 auto;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  input,select,textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:9px 11px; border-radius:9px; font-family:inherit; font-size:14px;
  }
  textarea{min-height:60px; resize:vertical;}
  .field{margin-bottom:10px;}
  button.btn{
    background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:10px;
    cursor:pointer; font-family:inherit; font-weight:600; font-size:14px;
  }
  button.btn.secondary{background:var(--panel2); border:1px solid var(--border); color:var(--text);}
  button.btn.danger{background:var(--red); color:#fff;}
  button.btn.small{padding:6px 12px; font-size:13px;}
  h2{font-size:17px; margin:0 0 14px;}
  h3{font-size:15px; margin:0 0 4px;}
  .muted{color:var(--muted); font-size:13px;}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600;
  }
  .badge.overdue{background:rgba(255,91,110,.18); color:var(--red);}
  .badge.today{background:rgba(255,171,64,.18); color:var(--orange);}
  .badge.soon{background:rgba(244,211,94,.18); color:var(--yellow);}
  .badge.ok{background:rgba(46,207,165,.18); color:var(--green);}
  .task-item{
    background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px;
    margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .task-info{flex:1; min-width:200px;}
  .device-card{cursor:pointer; transition:.15s;}
  .device-card:hover{border-color:var(--accent);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--border);}
  th{color:var(--muted); font-weight:600;}
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; max-width:520px; width:100%; max-height:85vh; overflow-y:auto;
  }
  .checklist-row{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border);}
  .checklist-row input[type=checkbox]{width:auto;}
  .close-x{background:transparent; border:none; color:var(--muted); font-size:20px; cursor:pointer; float:left;}
  .empty{text-align:center; color:var(--muted); padding:30px 0;}
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--accent2); color:#08281f; padding:12px 18px;
    border-radius:10px; font-weight:600; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .filters > div{flex:1; min-width:160px;}
  .toolbar{display:flex; gap:8px; justify-content:flex-end; margin-bottom:12px;}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; background:var(--panel2); border:1px solid var(--border);
    color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
  }
  .icon-btn.active-filter{ color:var(--accent); border-color:var(--accent); }
  .icon-btn svg{width:18px; height:18px;}
  .icon-btn .dot{
    position:absolute; top:-3px; left:-3px; width:9px; height:9px; border-radius:50%;
    background:var(--accent2); display:none;
  }
  .icon-btn.has-active .dot{display:block;}
  .panel{
    display:none; background:var(--panel2); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-bottom:14px;
  }
  .panel-title{font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:600;}
  .opt-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .opt-btn{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:7px 13px; border-radius:20px; cursor:pointer; font-size:13px; font-family:inherit;
  }
  .opt-btn.selected{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .sync-badge{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);
    background:var(--panel2); border:1px solid var(--border); padding:6px 12px; border-radius:20px;
    white-space:nowrap; margin-top:2px;
  }
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0;}
  .sync-badge.offline .sync-dot{background:var(--red);}
  .sync-badge.syncing .sync-dot{background:var(--orange);}
  #configWarning{
    background:rgba(255,171,64,.12); border:1px solid var(--orange); color:var(--orange);
    padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:13.5px;
  }
  ::placeholder{color:#5b6b8a;}

  .auth-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .auth-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:26px; max-width:380px; width:100%;
  }
  .auth-tabs{display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:10px;}
  .auth-tab{
    flex:1; background:transparent; border:none; color:var(--muted); padding:8px; border-radius:8px;
    cursor:pointer; font-family:inherit; font-size:13px;
  }
  .auth-tab.active{background:var(--accent); color:#fff; font-weight:600;}
  .auth-error{
    background:rgba(255,91,110,.12); border:1px solid var(--red); color:var(--red);
    padding:10px 14px; border-radius:9px; font-size:13px; margin-top:10px;
  }

  @media (max-width:640px){
    header{padding:14px 16px;}
    nav{padding:8px 16px;}
    main{padding:14px 14px 50px;}
    .card{padding:14px;}
    .task-item{flex-direction:column; align-items:stretch;}
    .task-item .row{justify-content:flex-end;}
    table{font-size:12.5px;}
    th,td{padding:6px 6px;}
    .modal{padding:16px;}
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <h1 style="font-size:19px; margin:0 0 4px;">🛠️ نگهداری و تعمیرات دستگاه‌ها</h1>
    <p class="muted" style="margin:0 0 18px;">برای ورود، نام کاربری و رمز عبورت رو وارد کن</p>

    <div class="auth-tabs">
      <button id="authTabLogin" class="auth-tab active" onclick="switchAuthTab('login')">ورود</button>
      <button id="authTabSignup" class="auth-tab" onclick="switchAuthTab('signup')">عضویت با کد دعوت واحد</button>
    </div>

    <div id="authLoginForm">
      <div class="field"><label>نام کاربری</label><input id="loginUsername" placeholder="مثلاً ali.bargh"></div>
      <div class="field"><label>رمز عبور</label><input id="loginPassword" type="password" placeholder="••••••"></div>
      <button class="btn" style="width:100%;" onclick="doLogin()">ورود</button>
    </div>

    <div id="authSignupForm" style="display:none;">
      <div class="field"><label>نام و نام‌خانوادگی</label><input id="signupFullName" placeholder="مثلاً علی رضایی"></div>
      <div class="field"><label>نام کاربری (بدون فاصله، لاتین)</label><input id="signupUsername" placeholder="مثلاً ali.bargh"></div>
      <div class="field"><label>رمز عبور (حداقل ۶ کاراکتر)</label><input id="signupPassword" type="password" placeholder="••••••"></div>
      <div class="field"><label>کد دعوت واحد (از مدیر واحدت بگیر)</label><input id="signupInviteCode" placeholder="مثلاً BARGH-1404"></div>
      <button class="btn" style="width:100%;" onclick="doSignup()">عضویت در واحد</button>
    </div>

    <div id="authError" class="auth-error" style="display:none;"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">

<header>
  <div class="row" style="justify-content:space-between; align-items:flex-start;">
    <div>
      <h1>🛠️ نگهداری و تعمیرات دستگاه‌ها</h1>
      <p id="headerSubtitle">سیستم مشترک PM — سررسید سرویس‌ها، چک‌لیست و گزارش کارها</p>
    </div>
    <div class="row" style="align-items:center;">
      <div id="syncBadge" class="sync-badge"></div>
      <button class="icon-btn" title="حساب کاربری" onclick="togglePanel('accountPanel')">👤</button>
    </div>
  </div>
  <div class="panel" id="accountPanel" style="margin-top:12px;"></div>
</header>

<nav>
  <button data-tab="dashboard" class="active">📋 سررسیدها</button>
  <button data-tab="devices">⚙️ دستگاه‌ها</button>
  <button data-tab="tasks">🧾 تسک‌های PM</button>
  <button data-tab="reports">📊 گزارش‌ها</button>
</nav>

<main>
  <div id="configWarning" style="display:none;"></div>
  <div id="tab-dashboard"></div>
  <div id="tab-devices" style="display:none;"></div>
  <div id="tab-tasks" style="display:none;"></div>
  <div id="tab-reports" style="display:none;"></div>
</main>

<div id="modalRoot"></div>

</div><!-- /appRoot -->

<script>
// ==========================================================
// تنظیمات Supabase — این دو مقدار رو از پروژه Supabase خودت بذار
// ==========================================================
const SUPABASE_URL = "https://xxomzjvyfndabjglrovs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1xqnKtnZpFpWFNjAZl5mOQ_4In1sVaF";
// ==========================================================

let sb = null;
try {
  if (SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY") {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } else {
    document.getElementById('configWarning').style.display = 'block';
    document.getElementById('configWarning').innerText =
      '⚠️ هنوز آدرس Supabase و anon key تنظیم نشده. مقادیر SUPABASE_URL و SUPABASE_ANON_KEY رو در بالای فایل پر کن.';
  }
} catch (err) {
  console.error('Supabase init failed:', err);
  document.getElementById('configWarning').style.display = 'block';
  document.getElementById('configWarning').innerText =
    '⚠️ اتصال به Supabase برقرار نشد (کتابخانه لود نشد). کنسول مرورگر (F12) را چک کن.';
}

const PERIOD_LABELS = { day:'روزانه', week:'هفتگی', month:'ماهانه', season:'فصلی', year:'سالانه', custom:'دلخواه (روز)' };

const SORT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 10 12 5 17 10"/><polyline points="7 14 12 19 17 14"/></svg>`;
const FUNNEL_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18a1 1 0 0 1 .8 1.6l-6.8 8.5V19a1 1 0 0 1-.45.84l-3 2A1 1 0 0 1 10 21v-6.9L3.2 5.6A1 1 0 0 1 4 4z"/></svg>`;

let state = {
  devices: [], tasks: [], logs: [], activeTab:'dashboard',
  reportDeviceFilter:'', reportFrom:'', reportTo:'', reportSort:'date_desc',
  dashSort:'due_asc', dashFilterStatus:'all', dashFilterDevice:'',
  devSort:'name_asc', devFilterLocation:'',
  taskSort:'due_asc', taskFilterDevice:'', taskFilterPeriod:'',
  departments: []
};

// ---------- AUTH ----------
let session = null;
let profile = null; // {id, full_name, role, department_id, departments:{name, invite_code}}

function usernameToEmail(u){
  return u.trim().toLowerCase().replace(/\s+/g,'.') + '@pm.local';
}
function isAdmin(){ return profile && profile.role === 'admin'; }
function isManagerOrAdmin(){ return profile && (profile.role === 'admin' || profile.role === 'manager'); }

function switchAuthTab(tab){
  document.getElementById('authTabLogin').classList.toggle('active', tab==='login');
  document.getElementById('authTabSignup').classList.toggle('active', tab==='signup');
  document.getElementById('authLoginForm').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('authSignupForm').style.display = tab==='signup' ? 'block' : 'none';
  document.getElementById('authError').style.display = 'none';
}
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.style.display = 'block';
  el.innerText = msg;
}

async function doLogin(){
  if(!sb){ showAuthError('اتصال به Supabase برقرار نیست.'); return; }
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!username || !password){ showAuthError('نام کاربری و رمز عبور را وارد کن.'); return; }
  const {data, error} = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password });
  if(error){ showAuthError('ورود ناموفق بود. نام کاربری یا رمز عبور اشتباه است.'); return; }
  session = data.session;
  await afterLogin();
}

async function doSignup(){
  if(!sb){ showAuthError('اتصال به Supabase برقرار نیست.'); return; }
  const full_name = document.getElementById('signupFullName').value.trim();
  const username = document.getElementById('signupUsername').value.trim();
  const password = document.getElementById('signupPassword').value;
  const invite_code = document.getElementById('signupInviteCode').value.trim();
  if(!full_name || !username || !password || !invite_code){ showAuthError('همه فیلدها را پر کن.'); return; }
  if(password.length < 6){ showAuthError('رمز عبور باید حداقل ۶ کاراکتر باشد.'); return; }

  const {data, error} = await sb.auth.signUp({ email: usernameToEmail(username), password });
  if(error){ showAuthError('عضویت ناموفق بود: ' + (error.message || 'خطای ناشناخته')); return; }
  session = data.session;
  if(!session){ showAuthError('حساب ساخته شد ولی ورود خودکار انجام نشد؛ از تب «ورود» وارد شو.'); switchAuthTab('login'); return; }

  const {error:rpcErr} = await sb.rpc('join_department', { p_invite_code: invite_code, p_full_name: full_name });
  if(rpcErr){ showAuthError('کد دعوت نامعتبر است: ' + rpcErr.message); return; }
  await afterLogin();
}

async function doLogout(){
  if(sb) await sb.auth.signOut();
  session = null; profile = null;
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}

async function loadProfile(){
  const {data, error} = await sb.from('profiles')
    .select('*, departments(name, invite_code)')
    .eq('id', session.user.id).single();
  if(error || !data){ profile = null; return false; }
  profile = data;
  return true;
}

async function afterLogin(){
  const ok = await loadProfile();
  if(!ok){
    showAuthError('حساب ساخته شده ولی هنوز به هیچ واحدی متصل نیست. با ادمین سیستم تماس بگیر.');
    return;
  }
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  renderAccountPanel();
  loadCache();
  renderAll();
  updateSyncBadge();
  if(sb){ loadAll(); checkConnectivity(); }
}

function renderAccountPanel(){
  const el = document.getElementById('accountPanel');
  if(!el || !profile) return;
  const roleLabel = {admin:'ادمین کل', manager:'مدیر واحد', worker:'نیروی عملیاتی'}[profile.role] || profile.role;
  const deptName = profile.departments ? profile.departments.name : '—';
  const invite = (profile.role !== 'worker' && profile.departments) ?
    `<div class="muted" style="margin-top:8px;">کد دعوت واحد برای نیروهای جدید: <b style="color:var(--text);">${profile.departments.invite_code}</b></div>` : '';
  document.getElementById('headerSubtitle').innerText = `${deptName} · ${roleLabel}`;
  el.innerHTML = `
    <div class="panel-title">حساب کاربری</div>
    <div>${profile.full_name} — ${roleLabel} — واحد: ${deptName}</div>
    ${invite}
    <button class="btn small danger" style="margin-top:12px;" onclick="doLogout()">خروج از حساب</button>
  `;
}

function togglePanel(id){
  document.querySelectorAll('.panel').forEach(p=>{ if(p.id!==id) p.style.display='none'; });
  const el = document.getElementById(id);
  if(!el) return;
  el.style.display = (el.style.display==='block') ? 'none' : 'block';
}
function optBtn(label, value, currentValue, onclickFn){
  const sel = (value===currentValue) ? 'selected' : '';
  return `<button class="opt-btn ${sel}" onclick="${onclickFn}('${value}')">${label}</button>`;
}
function toolbarHtml(sortPanelId, filterPanelId, hasActiveFilter){
  return `<div class="toolbar">
    <button class="icon-btn" title="مرتب‌سازی" onclick="togglePanel('${sortPanelId}')">${SORT_ICON}</button>
    <button class="icon-btn ${hasActiveFilter?'has-active':''}" title="فیلتر" onclick="togglePanel('${filterPanelId}')">${FUNNEL_ICON}<span class="dot"></span></button>
  </div>`;
}
function sortByKey(arr, key, getters){
  const arr2 = arr.slice();
  const [field, dir] = key.split('_');
  const get = getters[field];
  arr2.sort((a,b)=>{
    let va = get(a), vb = get(b);
    let cmp;
    if(typeof va === 'string') cmp = va.localeCompare(vb, 'fa');
    else cmp = va - vb;
    return dir === 'desc' ? -cmp : cmp;
  });
  return arr2;
}

// ---------- OFFLINE CACHE + SYNC QUEUE ----------
state.syncQueue = [];
state.syncing = false;
state.isOnline = navigator.onLine;
state.needsRefresh = false;

function isTemp(id){ return typeof id === 'string' && id.startsWith('tmp_'); }
function makeTempId(){ return 'tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

function saveCache(){
  try{
    localStorage.setItem('pm_cache', JSON.stringify({devices:state.devices, tasks:state.tasks, logs:state.logs}));
  }catch(e){ console.error('cache save failed', e); }
}
function loadCache(){
  try{
    const raw = localStorage.getItem('pm_cache');
    if(raw){ const c = JSON.parse(raw); state.devices = c.devices||[]; state.tasks = c.tasks||[]; state.logs = c.logs||[]; }
  }catch(e){}
  try{
    const rawQ = localStorage.getItem('pm_sync_queue');
    state.syncQueue = rawQ ? JSON.parse(rawQ) : [];
  }catch(e){ state.syncQueue = []; }
}
function saveQueue(){
  try{ localStorage.setItem('pm_sync_queue', JSON.stringify(state.syncQueue)); }catch(e){}
}
function enqueue(action){
  action.qid = makeTempId();
  state.syncQueue.push(action);
  saveQueue();
  updateSyncBadge();
}
function removeQueueAndDeps(tempId){
  state.syncQueue = state.syncQueue.filter(q=>{
    if(q.tempId === tempId) return false;
    const p = q.payload || {};
    if(p.device_id===tempId || p.task_id===tempId || p.id===tempId) return false;
    return true;
  });
  saveQueue();
}
function resolveTempIds(obj, idMap){
  if(!obj) return obj;
  const out = {...obj};
  ['id','device_id','task_id'].forEach(k=>{
    if(out[k] && idMap[out[k]] !== undefined) out[k] = idMap[out[k]];
  });
  return out;
}

function hasUnsavedInput(){
  const ids = ['newDeviceName','newDeviceLocation','newDeviceDesc','newTaskTitle','newTaskChecklist','doneBy','doneNotes'];
  return ids.some(id=>{
    const el = document.getElementById(id);
    return el && el.value && el.value.trim().length > 0;
  });
}

function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const pending = state.syncQueue.length;
  if(state.syncing){
    el.className = 'sync-badge syncing';
    el.innerHTML = `<span class="sync-dot"></span> در حال همگام‌سازی...`;
  } else if(!state.isOnline){
    el.className = 'sync-badge offline';
    el.innerHTML = `<span class="sync-dot"></span> آفلاین${pending ? ' · '+pending+' مورد در صف' : ''}`;
  } else if(pending){
    el.className = 'sync-badge syncing';
    el.innerHTML = `<span class="sync-dot"></span> آنلاین — ${pending} مورد در صفِ ارسال`;
  } else {
    el.className = 'sync-badge';
    el.innerHTML = `<span class="sync-dot"></span> آنلاین و همگام`;
  }
}

// تست واقعیِ اتصال (نه فقط وضعیت کارت شبکه) — هر ۶۰ ثانیه، بدون رفرش صفحه یا فرم‌ها
async function checkConnectivity(){
  if(!sb){ state.isOnline = navigator.onLine; updateSyncBadge(); return; }
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 8000);
    const {error} = await sb.from('devices').select('id').limit(1).abortSignal(controller.signal);
    clearTimeout(timer);
    state.isOnline = !error;
  }catch(err){
    state.isOnline = false;
  }
  updateSyncBadge();
  if(state.isOnline){
    processSyncQueue();
    if(state.needsRefresh && !hasUnsavedInput()){
      state.needsRefresh = false;
      loadAll();
    }
  }
}

async function processSyncQueue(){
  if(!sb || !state.isOnline || state.syncing || !state.syncQueue.length) return;
  state.syncing = true;
  updateSyncBadge();
  const idMap = {};
  const queue = state.syncQueue.slice();

  for(let i=0; i<queue.length; i++){
    const action = queue[i];
    try{
      if(action.type==='addDevice'){
        const payload = resolveTempIds(action.payload, idMap);
        const {data, error} = await sb.from('devices').insert(payload).select().single();
        if(error) throw error;
        idMap[action.tempId] = data.id;
      } else if(action.type==='addTask'){
        const payload = resolveTempIds(action.payload, idMap);
        const {data, error} = await sb.from('pm_tasks').insert(payload).select().single();
        if(error) throw error;
        idMap[action.tempId] = data.id;
      } else if(action.type==='completeTask'){
        const payload = resolveTempIds(action.payload, idMap);
        const {error:e1} = await sb.from('task_logs').insert(payload);
        if(e1) throw e1;
        const tu = resolveTempIds(action.taskUpdate, idMap);
        const {error:e2} = await sb.from('pm_tasks').update({last_done:tu.last_done, next_due:tu.next_due}).eq('id', tu.task_id);
        if(e2) throw e2;
      } else if(action.type==='editDevice'){
        const payload = resolveTempIds(action.payload, idMap);
        const {id, ...rest} = payload;
        const {error} = await sb.from('devices').update(rest).eq('id', id);
        if(error) throw error;
      } else if(action.type==='editTask'){
        const payload = resolveTempIds(action.payload, idMap);
        const {id, ...rest} = payload;
        const {error} = await sb.from('pm_tasks').update(rest).eq('id', id);
        if(error) throw error;
      } else if(action.type==='deleteDevice'){
        const payload = resolveTempIds(action.payload, idMap);
        const {error} = await sb.from('devices').delete().eq('id', payload.id);
        if(error) throw error;
      } else if(action.type==='deleteTask'){
        const payload = resolveTempIds(action.payload, idMap);
        const {error} = await sb.from('pm_tasks').delete().eq('id', payload.id);
        if(error) throw error;
      }
      // remove this specific action from the real queue on success
      state.syncQueue = state.syncQueue.filter(q=>q.qid !== action.qid);
      saveQueue();
    } catch(err){
      console.error('sync stopped, will retry later:', err);
      state.syncing = false;
      updateSyncBadge();
      return; // stop here, keep remaining items queued for next attempt
    }
  }

  state.syncing = false;

  // اگر کاربر همین الان داره تو یه فرم چیزی تایپ می‌کنه، رفرش کامل لیست رو عقب می‌ندازیم
  // تا چیزی که تایپ کرده پاک نشه؛ داده‌ها با موفقیت سینک شدن، فقط نمایش به‌روزرسانی نمیشه.
  if(hasUnsavedInput()){
    state.needsRefresh = true;
    toast('همگام‌سازی انجام شد ✓ (نمایش لیست وقتی فرم خالی شد به‌روز میشه)');
  } else {
    await loadAll();
    toast('همگام‌سازی با سرور انجام شد ✓');
  }
  updateSyncBadge();
}

// ---------- helpers ----------
function fmtDate(d){
  if(!d) return '—';
  try{
    return new Date(d).toLocaleDateString('fa-IR', { year:'numeric', month:'2-digit', day:'2-digit' });
  }catch(e){ return d; }
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysDiff(dateStr){
  const d = new Date(dateStr); const t = new Date(todayISO());
  return Math.round((d - t) / 86400000);
}
function addPeriod(baseDateStr, type, value){
  const d = new Date(baseDateStr);
  value = Number(value) || 1;
  switch(type){
    case 'day': d.setDate(d.getDate() + value); break;
    case 'week': d.setDate(d.getDate() + value*7); break;
    case 'month': d.setMonth(d.getMonth() + value); break;
    case 'season': d.setMonth(d.getMonth() + value*3); break;
    case 'year': d.setFullYear(d.getFullYear() + value); break;
    case 'custom': d.setDate(d.getDate() + value); break;
    default: d.setMonth(d.getMonth() + value);
  }
  return d.toISOString().slice(0,10);
}
function statusOf(nextDue){
  const diff = daysDiff(nextDue);
  if(diff < 0) return {key:'overdue', label:`${Math.abs(diff)} روز عقب‌افتاده`};
  if(diff === 0) return {key:'today', label:'امروز سررسیده'};
  if(diff <= 3) return {key:'soon', label:`${diff} روز دیگر`};
  return {key:'ok', label:`${diff} روز دیگر`};
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2500);
}
function deviceName(id){ const d = state.devices.find(x=>x.id===id); return d ? d.name : '—'; }
function taskById(id){ return state.tasks.find(t=>t.id===id); }

// ---------- data loading ----------
async function loadAll(){
  if(!sb){ renderAll(); return; }
  try{
    const queries = [
      sb.from('devices').select('*').order('created_at', {ascending:true}),
      sb.from('pm_tasks').select('*').order('next_due', {ascending:true}),
      sb.from('task_logs').select('*').order('performed_date', {ascending:false}).limit(500)
    ];
    if(isAdmin()) queries.push(sb.from('departments').select('*').order('name'));

    const results = await Promise.all(queries);
    const [{data:devices, error:e1}, {data:tasks, error:e2}, {data:logs, error:e3}] = results;
    if(e1||e2||e3) throw (e1||e2||e3);
    if(isAdmin() && results[3]){
      if(results[3].error) throw results[3].error;
      state.departments = results[3].data || [];
    }

    let devs = devices || [], tks = tasks || [], lgs = logs || [];
    // اعمال ویرایش/حذف‌های در صفِ ارسال روی داده تازه دریافت‌شده
    state.syncQueue.forEach(q=>{
      if(q.type==='deleteDevice') devs = devs.filter(d=>d.id!==q.payload.id);
      if(q.type==='deleteTask') tks = tks.filter(t=>t.id!==q.payload.id);
      if(q.type==='editDevice'){ const d=devs.find(x=>x.id===q.payload.id); if(d) Object.assign(d,q.payload); }
      if(q.type==='editTask'){ const t=tks.find(x=>x.id===q.payload.id); if(t) Object.assign(t,q.payload); }
    });
    // نمایش موقت آیتم‌های تازه‌ساخته که هنوز به سرور نرسیده‌اند
    state.syncQueue.forEach(q=>{
      if(q.type==='addDevice') devs.push({...q.payload, id:q.tempId, created_at:new Date().toISOString(), _pending:true});
      if(q.type==='addTask') tks.push({...q.payload, id:q.tempId, last_done:null, active:true, _pending:true});
      if(q.type==='completeTask') lgs.unshift({...q.payload, id:q.tempId, created_at:new Date().toISOString(), _pending:true});
    });

    state.devices = devs; state.tasks = tks; state.logs = lgs;
    saveCache();
    renderAll();
    updateSyncBadge();
    processSyncQueue();
  } catch(err){
    console.error('اتصال برقرار نشد، از نسخه محلی استفاده می‌شود:', err);
    renderAll();
    updateSyncBadge();
  }
}

    section('soon', 'نزدیک سررسید', 'soon') +
    section('ok', 'در برنامه', 'ok');

  el.innerHTML = toolbarAndPanels + (sections || '<div class="card empty">با این فیلتر موردی یافت نشد.</div>');

  if(navigator.onLine){
    try{
      const {error} = await sb.from('devices').insert(payload);
      if(error) throw error;
      toast('دستگاه اضافه شد');
      loadAll();

    }catch(err){ console.error('آنلاین بود ولی ارسال ناموفق شد، در صف ذخیره می‌شود:', err); }

async function deleteDevice(id){
  const taskCount = state.tasks.filter(t=>t.device_id===id).length;
  const msg = taskCount ? `این دستگاه ${taskCount} تسک دارد. حذف دستگاه، تسک‌ها و گزارش‌های مربوطه را هم حذف می‌کند. ادامه می‌دهی؟` : 'این دستگاه حذف شود؟';
  if(!confirm(msg)) return;

  if(isTemp(id)){
    removeQueueAndDeps(id);
    state.devices = state.devices.filter(d=>d.id!==id);
    state.tasks = state.tasks.filter(t=>t.device_id!==id);
    saveCache(); renderAll(); toast('حذف شد');
    return;
  }
  if(navigator.onLine){
    try{
      const {error} = await sb.from('devices').delete().eq('id', id);
      if(error) throw error;
      toast('حذف شد'); loadAll();
      return;
    }catch(err){ console.error('حذف آنلاین ناموفق، در صف ذخیره می‌شود:', err); }
  }
  state.devices = state.devices.filter(d=>d.id!==id);
  state.tasks = state.tasks.filter(t=>t.device_id!==id);
  enqueue({type:'deleteDevice', payload:{id}});
  saveCache();
  renderAll();
  toast('📥 آفلاین: حذف ذخیره شد، با اتصال بعدی اعمال می‌شود');
}

    due: t=>new Date(t.next_due).getTime(),
    title: t=>t.title
  };

  const taskCards = state.devices.map(d=>{
    let tasks = state.tasks.filter(t=>t.device_id===d.id);
    if(state.taskFilterDevice && d.id !== state.taskFilterDevice) return '';
    if(state.taskFilterPeriod) tasks = tasks.filter(t=>t.period_type === state.taskFilterPeriod);
    if(!tasks.length) return '';
    tasks = sortByKey(tasks, state.taskSort, getters);
    const rows = tasks.map(t=>{
      const st = statusOf(t.next_due);
      const checklist = Array.isArray(t.checklist) ? t.checklist : [];
      return `<div class="task-item">
        <div class="task-info">
          <h3>${t.title} <span class="badge ${st.key}">${st.label}</span>${t._pending ? ' <span class="badge soon">⏳ در صف ارسال</span>' : ''}</h3>
          <div class="muted">دوره: ${PERIOD_LABELS[t.period_type]||''}${t.period_type==='custom' ? ' — هر '+t.period_value+' روز' : ''} · آخرین انجام: ${fmtDate(t.last_done)} · سررسید بعدی: ${fmtDate(t.next_due)}</div>
          ${checklist.length ? `<div class="muted">چک‌لیست: ${checklist.join('، ')}</div>` : ''}
        </div>
        ${isManagerOrAdmin() ? `<div class="row">
          <button class="btn small secondary" onclick="editTaskPrompt('${t.id}')">ویرایش</button>
          <button class="btn small danger" onclick="deleteTask('${t.id}')">حذف</button>
        </div>` : ''}
      </div>`;
    }).join('');
    return `<div class="card"><h2>${d.name}</h2>${rows}</div>`;
  }).join('') || '';

  const addForm = isManagerOrAdmin() ? `
    <div class="card">
      <h2>افزودن تسک PM جدید</h2>
      <div class="grid">
        <div class="field"><label>دستگاه *</label><select id="newTaskDevice">${deviceOptions}</select></div>
        <div class="field"><label>عنوان تسک *</label><input id="newTaskTitle" placeholder="مثلاً روغن‌کاری، تعویض فیلتر..."></div>
        <div class="field"><label>نوع دوره</label><select id="newTaskPeriodType">${periodOptions}</select></div>
        <div class="field"><label>مقدار دوره (برای دلخواه: تعداد روز)</label><input id="newTaskPeriodValue" type="number" min="1" value="1"></div>
        <div class="field"><label>تاریخ شروع سررسید</label><input id="newTaskStartDate" type="date" value="${todayISO()}"></div>
      </div>
      <div class="field"><label>چک‌لیست / قطعات (هر مورد در یک خط)</label><textarea id="newTaskChecklist" placeholder="مثلاً:&#10;چک روغن&#10;تعویض فیلتر هوا&#10;بازرسی تسمه"></textarea></div>
      <button class="btn" onclick="addTask()">افزودن تسک</button>
    </div>` : '';

  el.innerHTML = `
    ${addForm}
    ${toolbarAndPanels}
    ${taskCards || '<div class="card empty">با این فیلتر تسکی یافت نشد.</div>'}
  `;
}

async function addTask(){
  const device_id = document.getElementById('newTaskDevice').value;
  const title = document.getElementById('newTaskTitle').value.trim();
  const period_type = document.getElementById('newTaskPeriodType').value;
  const period_value = Number(document.getElementById('newTaskPeriodValue').value) || 1;
  const startDate = document.getElementById('newTaskStartDate').value || todayISO();
  const checklistRaw = document.getElementById('newTaskChecklist').value;
  const checklist = checklistRaw.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!title){ toast('عنوان تسک را وارد کن'); return; }
  const payload = { device_id, title, period_type, period_value, checklist, next_due: startDate };

  if(navigator.onLine && !isTemp(device_id)){
    try{
      const {error} = await sb.from('pm_tasks').insert(payload);
      if(error) throw error;
      toast('تسک اضافه شد'); loadAll();
      return;
    }catch(err){ console.error('ثبت آنلاین ناموفق، در صف ذخیره می‌شود:', err); }
  }
  const tempId = makeTempId();
  state.tasks.push({...payload, id:tempId, last_done:null, active:true, _pending:true});
  enqueue({type:'addTask', tempId, payload});
  saveCache();
  renderAll();
  toast('📥 آفلاین: تسک ذخیره شد، با اتصال بعدی ارسال می‌شود');
}

async function editTaskPrompt(id){
  const t = taskById(id);
  const title = prompt('عنوان تسک:', t.title);
  if(title===null) return;
  const period_value = Number(prompt('مقدار دوره:', t.period_value)) || 1;
  t.title = title; t.period_value = period_value;

  if(navigator.onLine && !isTemp(id)){
    try{
      const {error} = await sb.from('pm_tasks').update({title, period_value}).eq('id', id);
      if(error) throw error;
      toast('ذخیره شد'); loadAll();
      return;
    }catch(err){ console.error('ویرایش آنلاین ناموفق، در صف ذخیره می‌شود:', err); }
  }
  enqueue({type:'editTask', payload:{id, title, period_value}});
  saveCache();
  renderAll();
  toast('📥 آفلاین: ویرایش ذخیره شد، با اتصال بعدی ارسال می‌شود');
}

async function deleteTask(id){
  if(!confirm('این تسک و تاریخچه گزارش‌هایش حذف شود؟')) return;

  if(isTemp(id)){
    removeQueueAndDeps(id);
    state.tasks = state.tasks.filter(t=>t.id!==id);
    saveCache(); renderAll(); toast('حذف شد');
    return;
  }
  if(navigator.onLine){
    try{
      const {error} = await sb.from('pm_tasks').delete().eq('id', id);
      if(error) throw error;
      toast('حذف شد'); loadAll();
      return;
    }catch(err){ console.error('حذف آنلاین ناموفق، در صف ذخیره می‌شود:', err); }
  }
  state.tasks = state.tasks.filter(t=>t.id!==id);
  enqueue({type:'deleteTask', payload:{id}});
  saveCache();
  renderAll();
  toast('📥 آفلاین: حذف ذخیره شد، با اتصال بعدی اعمال می‌شود');
}

// ---------- COMPLETE TASK MODAL ----------
function openCompleteModal(taskId){
  const t = taskById(taskId);
  const checklist = Array.isArray(t.checklist) ? t.checklist : [];
  const checklistHtml = checklist.map((item, i)=>`
    <div class="checklist-row">
      <input type="checkbox" id="chk_${i}" checked>
      <label for="chk_${i}" style="margin:0; flex:1; color:var(--text);">${item}</label>
    </div>`).join('');

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">×</button>
        <h2>ثبت انجام کار: ${t.title}</h2>
        <div class="muted" style="margin-bottom:12px;">${deviceName(t.device_id)}</div>
        <div class="field"><label>تاریخ انجام</label><input type="date" id="doneDate" value="${todayISO()}"></div>
        <div class="field"><label>انجام‌شده توسط</label><input id="doneBy" value="${profile ? profile.full_name : ''}" placeholder="نام..."></div>
        ${checklist.length ? `<div class="field"><label>چک‌لیست</label>${checklistHtml}</div>` : ''}
        <div class="field"><label>یادداشت</label><textarea id="doneNotes" placeholder="توضیح اختیاری..."></textarea></div>
        <button class="btn" onclick="submitCompleteTask('${t.id}')">ثبت و برنامه‌ریزی سررسید بعدی</button>
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

async function submitCompleteTask(taskId){
  const t = taskById(taskId);
  const performed_date = document.getElementById('doneDate').value || todayISO();
  const performed_by = document.getElementById('doneBy').value.trim();
  const notes = document.getElementById('doneNotes').value.trim();
  const checklist = Array.isArray(t.checklist) ? t.checklist : [];
  const checklist_results = checklist.map((item,i)=>({
    item, checked: document.getElementById('chk_'+i) ? document.getElementById('chk_'+i).checked : true
  }));
  const next_due = addPeriod(performed_date, t.period_type, t.period_value);
  const logPayload = { task_id: taskId, device_id: t.device_id, performed_date, performed_by, checklist_results, notes };

  if(navigator.onLine && !isTemp(taskId)){
    try{
      const {error:e1} = await sb.from('task_logs').insert(logPayload);
      if(e1) throw e1;
      const {error:e2} = await sb.from('pm_tasks').update({ last_done: performed_date, next_due }).eq('id', taskId);
      if(e2) throw e2;
      closeModal();
      toast(`ثبت شد ✓ سررسید بعدی: ${fmtDate(next_due)}`);
      loadAll();
      return;
    }catch(err){ console.error('ثبت آنلاین ناموفق، در صف ذخیره می‌شود:', err); }
  }

  // مسیر آفلاین: ذخیره محلی + قرارگیری در صفِ ارسال
  t.last_done = performed_date;
  t.next_due = next_due;
  state.logs.unshift({...logPayload, id:makeTempId(), created_at:new Date().toISOString(), _pending:true});
  enqueue({ type:'completeTask', tempId:makeTempId(), payload:logPayload, taskUpdate:{ task_id:taskId, last_done:performed_date, next_due } });
  saveCache();
  closeModal();
  renderAll();
  toast(`📥 آفلاین: کار ثبت شد، با اتصال بعدی ارسال می‌شود (سررسید بعدی: ${fmtDate(next_due)})`);
}

// ---------- REPORTS ----------
function setReportSort(v){ state.reportSort = v; renderReports(); }
function setReportDevice(v){ state.reportDeviceFilter = v; renderReports(); }
function setReportFrom(v){ state.reportFrom = v; renderReports(); }
function setReportTo(v){ state.reportTo = v; renderReports(); }

function getFilteredReportLogs(){
  let logs = state.logs.slice();
  if(state.reportDeviceFilter) logs = logs.filter(l=>l.device_id === state.reportDeviceFilter);
  if(state.reportFrom) logs = logs.filter(l=>l.performed_date >= state.reportFrom);
  if(state.reportTo) logs = logs.filter(l=>l.performed_date <= state.reportTo);
  const getters = {
    date: l=>new Date(l.performed_date).getTime(),
    device: l=>deviceName(l.device_id),
    performer: l=>l.performed_by || ''
  };
  return sortByKey(logs, state.reportSort, getters);
}

function renderReports(){
  const el = document.getElementById('tab-reports');
  const deviceOptions = `<option value="">همه دستگاه‌ها</option>` +
    state.devices.map(d=>`<option value="${d.id}" ${state.reportDeviceFilter===d.id?'selected':''}>${d.name}</option>`).join('');
  const hasFilter = !!state.reportDeviceFilter || !!state.reportFrom || !!state.reportTo;

  const logs = getFilteredReportLogs();

  const rows = logs.map(l=>{
    const t = taskById(l.task_id);
    const chk = Array.isArray(l.checklist_results) ? l.checklist_results : [];
    const chkSummary = chk.length ? `${chk.filter(c=>c.checked).length}/${chk.length} تیک خورده` : '—';
    return `<tr>
      <td>${fmtDate(l.performed_date)}${l._pending ? ' ⏳' : ''}</td>
      <td>${deviceName(l.device_id)}</td>
      <td>${t ? t.title : '—'}</td>
      <td>${l.performed_by || '—'}</td>
      <td>${chkSummary}</td>
      <td>${l.notes || ''}</td>
    </tr>`;
  }).join('');

  const toolbarAndPanels = `
    ${toolbarHtml('repSortPanel','repFilterPanel', hasFilter)}
    <div class="panel" id="repSortPanel">
      <div class="panel-title">مرتب‌سازی بر اساس</div>
      <div class="opt-row">
        ${optBtn('جدیدترین تاریخ','date_desc',state.reportSort,'setReportSort')}
        ${optBtn('قدیمی‌ترین تاریخ','date_asc',state.reportSort,'setReportSort')}
        ${optBtn('نام دستگاه (الفبا)','device_asc',state.reportSort,'setReportSort')}
        ${optBtn('نام انجام‌دهنده (الفبا)','performer_asc',state.reportSort,'setReportSort')}
      </div>
    </div>
    <div class="panel" id="repFilterPanel">
      <div class="panel-title">فیلتر بر اساس دستگاه</div>
      <select onchange="setReportDevice(this.value)" style="margin-bottom:10px;">${deviceOptions}</select>
      <div class="row">
        <div class="field" style="flex:1;"><label>از تاریخ</label><input type="date" value="${state.reportFrom}" onchange="setReportFrom(this.value)"></div>
        <div class="field" style="flex:1;"><label>تا تاریخ</label><input type="date" value="${state.reportTo}" onchange="setReportTo(this.value)"></div>
      </div>
    </div>`;

  el.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2>تاریخچه سرویس‌ها (${logs.length} مورد)</h2>
        <button class="btn small" onclick="exportCSV()">⬇ خروجی CSV</button>
      </div>
      ${toolbarAndPanels}
      ${logs.length ? `<div style="overflow-x:auto;"><table>
        <thead><tr><th>تاریخ</th><th>دستگاه</th><th>تسک</th><th>انجام‌دهنده</th><th>چک‌لیست</th><th>یادداشت</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>` : '<div class="empty">گزارشی یافت نشد.</div>'}
    </div>
  `;
}

function exportCSV(){
  const logs = getFilteredReportLogs();
  const header = ['تاریخ','دستگاه','تسک','انجام‌دهنده','یادداشت'];
  const rows = logs.map(l=>{
    const t = taskById(l.task_id);
    return [l.performed_date, deviceName(l.device_id), t?t.title:'', l.performed_by||'', (l.notes||'').replace(/\n/g,' ')];
  });
  const csv = '\uFEFFsep=,\n' + [header, ...rows].map(r => r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'گزارش-سرویس‌ها.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- init ----------
switchAuthTab('login');
(async function initApp(){
  if(!sb){
    document.getElementById('authScreen').style.display = 'flex';
    return;
  }
  const {data:{session:existingSession}} = await sb.auth.getSession();
  if(existingSession){
    session = existingSession;
    await afterLogin();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
  }
})();
</script>
